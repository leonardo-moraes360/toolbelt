graph:
    index_on_change: true
    languages:
        - go
        - javascript
        - python
        - java
        - kotlin
        - csharp
        - cpp
        - rust
        - php
        - ruby
        - swift
        - shell
    docs:
        - markdown
        - html
        - txt
    frameworks:
        - react
        - vue
        - svelte
        - astro
        - angular
        - routes
        - mdx
    max_file_bytes: 524288
vault:
    path: .toolbelt/vault
bench:
    tasks_dir: bench/tasks
    fixtures_dir: bench/fixtures
    output_dir: bench/results
    default_agent: ""
    repetitions: 5
    timeout: 10m
verify:
    test_cmd: go test ./...
    hidden_test_cmd: ""
    build_cmd: go build ./...
    lint_cmd: go vet ./...
review:
    require_approved_sha: false
env:
    allow: []
    pass: []
router:
    max_workers: 3
    strategy: dependency
    agent_cmd: []
    direct_delivery:
        enabled: true
        subscription_ttl: 30m
        max_subscriptions_per_worker: 5
    timeouts:
        per_ticket: 10m
        global: 1h
    retry:
        max_attempts: 2
    slow_threshold: 0.8
