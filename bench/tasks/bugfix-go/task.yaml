id: bugfix-go
name: Corrigir divisão por zero
description: |
  O código tem um bug de divisão por zero. O agente deve:
  1. Identificar o problema
  2. Modificar a função divide para retornar erro quando b=0
  3. Fazer os testes passarem
category: bugfix
difficulty: easy
prompt: |
  Corrija o bug de divisão por zero no arquivo main.go.
  A função divide deve retornar um erro quando o divisor é zero.
  Os testes em main_test.go devem passar após a correção.
fixture: bugfix-go
verification:
  command: "go test -v ./..."
  timeout: "30s"
  expected_exit_code: 0
timeout: "5m"
hidden_tests: ""
