<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="pocketGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#BE2AC6"/>
      <stop offset="100%" style="stop-color:#F9278C"/>
    </linearGradient>
    <linearGradient id="beltGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#29282D"/>
      <stop offset="15%" style="stop-color:#761DC5"/>
      <stop offset="50%" style="stop-color:#982BD4"/>
      <stop offset="85%" style="stop-color:#761DC5"/>
      <stop offset="100%" style="stop-color:#29282D"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo círculo violeta -->
  <circle cx="512" cy="512" r="450" fill="#4A1999"/>
  
  <!-- Cinto horizontal -->
  <rect x="120" y="450" width="784" height="60" rx="8" fill="url(#beltGradient)"/>
  
  <!-- Pontas escuras do cinto -->
  <rect x="120" y="450" width="80" height="60" rx="8" fill="#29282D"/>
  <rect x="824" y="450" width="80" height="60" rx="8" fill="#29282D"/>
  
  <!-- Bolsinha/pocket (forma pentagonal) -->
  <path d="M350 480 L350 650 L512 750 L674 650 L674 480 Z" fill="url(#pocketGradient)"/>
  
  <!-- Botão branco na bolsinha -->
  <circle cx="512" cy="580" r="35" fill="#FFFFFF"/>
  
  <!-- Ferramenta/chave colchetes < > -->
  <g fill="#FFFFFF">
    <!-- Suporte vertical central -->
    <rect x="400" y="360" width="40" height="120" rx="6"/>
    <!-- Colchete esquerdo < -->
    <polygon points="360,320 400,320 400,340 375,340 375,380 360,380"/>
    <polygon points="360,440 375,440 375,480 400,480 400,500 360,500"/>
    <!-- Colchete direito > -->
    <polygon points="460,320 500,320 500,380 485,380 485,340 460,340"/>
    <polygon points="460,500 500,500 500,440 485,440 485,480 460,480"/>
  </g>
  
  <!-- Robozinho ciano -->
  <g>
    <!-- Antena haste -->
    <line x1="620" y1="340" x2="670" y2="260" stroke="#0CD7FF" stroke-width="12" stroke-linecap="round"/>
    <!-- Antena bolinha -->
    <circle cx="680" cy="245" r="25" fill="#0CD7FF"/>
    <!-- Cabeça do robô -->
    <rect x="560" y="340" width="130" height="90" rx="15" fill="#0CD7FF"/>
    <!-- Olhos -->
    <circle cx="595" cy="385" r="18" fill="#FFFFFF"/>
    <circle cx="655" cy="385" r="18" fill="#FFFFFF"/>
  </g>
</svg>
