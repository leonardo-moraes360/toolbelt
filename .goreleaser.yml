# GoReleaser configuration
# https://goreleaser.com

version: 2

project_name: toolbelt

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: tb
    main: ./cmd/tb
    binary: tb
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/leonardo-moraes360/toolbelt/internal/version.Version={{.Version}}
      - -X github.com/leonardo-moraes360/toolbelt/internal/version.Commit={{.Commit}}
      - -X github.com/leonardo-moraes360/toolbelt/internal/version.BuildTime={{.Date}}

  - id: fake-agent
    main: ./cmd/fake-agent
    binary: fake-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - docs/**/*
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: leonardo-moraes360
    name: toolbelt
  prerelease: auto
  draft: false
  name_template: "v{{.Version}}"

brews:
  - repository:
      owner: leonardo-moraes360
      name: homebrew-tap
    homepage: https://github.com/leonardo-moraes360/toolbelt
    description: Toolkit for AI coding agents
    license: Apache-2.0
    install: |
      bin.install "tb"
      bin.install "fake-agent"
    test: |
      system "#{bin}/tb", "version"

nfpms:
  - id: default
    package_name: toolbelt
    vendor: Leonardo Moraes
    homepage: https://github.com/leonardo-moraes360/toolbelt
    description: Toolkit for AI coding agents
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin

snapcrafts:
  - id: default
    name: toolbelt
    summary: Toolkit for AI coding agents
    description: |
      Toolbelt provides tools to improve AI coding agents:
      - Secure sandbox execution
      - Adversarial verification
      - Persistent memory
      - Dependency graph
      - Multi-agent routing
      - Benchmarking
    grade: stable
    confinement: strict
    license: Apache-2.0
    apps:
      tb:
        command: tb
        plugs:
          - home
          - network

announce:
  skip: "true"
