name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly run catches new queries against unchanged code.
    - cron: "27 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write # c-cpp: an alert in third_party/ opens an issue (ADR-018)

    strategy:
      fail-fast: false
      matrix:
        include:
          # Manual build: go.mod pins a toolchain newer than CodeQL's bundled Go.
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
          # The shim and the vendored llama.cpp, traced through a tagged build.
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        if: matrix.language == 'go' || matrix.language == 'c-cpp'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build
        if: matrix.language == 'go'
        run: go build ./...

      - name: Build (native)
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          scripts/build-native.sh linux amd64
          go build -a -tags embednative ./internal/embed/native

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      # CodeQL alerts do not block on their own. For c-cpp, an alert in the
      # shim fails the job; an alert in the vendored tree opens an issue and
      # is reported upstream, never silenced in place (ADR-018 §4).
      - name: Gate the c-cpp alerts
        if: matrix.language == 'c-cpp'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uris() { jq -r '.runs[].results[] | .locations[0].physicalLocation.artifactLocation.uri' sarif-results/*.sarif; }
          shim="$(uris | grep -c '^internal/embed/native/' || true)"
          vendor="$(uris | grep -c '^third_party/' || true)"
          if [ "$vendor" -gt 0 ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # A fixed title, so an open issue is found again when the count changes.
            title="CodeQL: alerts in vendored llama.cpp"
            open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number')"
            if [ -z "$open" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Run $GITHUB_RUN_ID found ${vendor} code scanning alert(s) under third_party/; triage and report upstream (ADR-018)."
            fi
          fi
          echo "c-cpp alerts: shim=$shim vendored=$vendor"
          [ "$shim" -eq 0 ]
