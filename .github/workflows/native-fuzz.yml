name: Native fuzz (nightly)

# ADR-018 native gate: the libFuzzer harness of the shim under ASan and
# UBSan, 1 hour nightly (the CI native job runs it 5 minutes per PR).
on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer (1 hour)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang

      - name: Cache the smoke model
        uses: actions/cache@v5
        with:
          path: ~/.cache/tb-smoke-model
          key: smoke-model-${{ hashFiles('.github/embed-smoke-model.txt') }}

      - name: Download the smoke model
        run: |
          mkdir -p ~/.cache/tb-smoke-model
          scripts/ci-smoke-model.sh ~/.cache/tb-smoke-model/model.gguf
          echo "TB_EMBED_MODEL=$HOME/.cache/tb-smoke-model/model.gguf" >> "$GITHUB_ENV"

      - name: libFuzzer
        run: scripts/native-fuzz.sh 3600
