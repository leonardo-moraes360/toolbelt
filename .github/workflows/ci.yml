name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out $(go list ./... | grep -v 'bench/fixtures')

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          args: --timeout=5m

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          go build -v -o bin/tb ./cmd/tb
          go build -v -o bin/fake-agent ./cmd/fake-agent

      # The release builds these targets (.goreleaser.yaml); a Linux-only
      # build missed a unix-only syscall in v0.0.7.
      - name: Cross-build the release targets
        run: |
          for t in linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "== $t"
            GOOS="${t%/*}" GOARCH="${t#*/}" go build ./...
          done

      - name: Verify binaries
        run: |
          ./bin/tb version
          ./bin/tb help

  bench-fake:
    name: Benchmark (Fake Agent)
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          go build -v -o bin/tb ./cmd/tb
          go build -v -o bin/fake-agent ./cmd/fake-agent

      - name: Run benchmark with fake agent
        run: ./bin/tb bench run --fake -r 1

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: bench/results/
          retention-days: 30

  # The C/C++ quality gate of ADR-018: shim lint and analysis, the vendored
  # tree hash, the embed tests with the smoke model, a sanitizer build, a
  # libFuzzer run and the static-initializer strace check.
  native:
    name: Native gate (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang clang-tidy clang-format cppcheck strace binutils

      - name: Lint the shim and check the vendored tree
        run: scripts/native-gate.sh lint

      - name: Cache the smoke model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tb-smoke-model
          key: smoke-model-${{ hashFiles('.github/embed-smoke-model.txt') }}

      - name: Download the smoke model
        run: |
          mkdir -p ~/.cache/tb-smoke-model
          scripts/ci-smoke-model.sh ~/.cache/tb-smoke-model/model.gguf
          echo "TB_EMBED_MODEL=$HOME/.cache/tb-smoke-model/model.gguf" >> "$GITHUB_ENV"

      - name: Build the native libraries and tb
        run: |
          scripts/build-native.sh "$(go env GOOS)" "$(go env GOARCH)"
          go build -tags embednative,netgo,osusergo -o bin/tb-native ./cmd/tb
          go build -o bin/tb ./cmd/tb
          ./bin/tb-native version | grep -q "embed:  llama.cpp"

      - name: Embed tests
        run: go test -tags embednative -count=1 ./internal/embed/... ./internal/version

      - name: AVX-tier code only in ggml-cpu (ADR-019)
        if: runner.arch == 'X64'
        run: python3 scripts/avx-audit.py bin/tb-native internal/embed/native/build/linux_amd64/lib

      - name: Pre-AVX CPU under QEMU (ADR-019)
        if: runner.arch == 'X64'
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user
          q="qemu-x86_64 -cpu Nehalem"
          for c in "version" "graph --help" "mem list" "sandbox check"; do
            # shellcheck disable=SC2086
            $q bin/tb-native $c >/dev/null 2>"$RUNNER_TEMP/err" || { cat "$RUNNER_TEMP/err"; exit 1; }
          done
          sha="$(sed -n 's/^sha256: //p' .github/embed-smoke-model.txt)"
          set +e
          $q bin/tb-native __graph-embed --smoke "$TB_EMBED_MODEL" --sha256 "$sha" 2>"$RUNNER_TEMP/err"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/err"
          [ "$rc" = 2 ] && grep -q embed_cpu_unsupported "$RUNNER_TEMP/err"

      - name: Static initializers do no I/O
        run: scripts/native-gate.sh strace bin/tb-native bin/tb

      - name: Sanitizer build (ASan + UBSan) and embed tests
        run: |
          san="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          # ggml calls its dequantize table through a type-punned function
          # pointer by design; only the vendored libraries skip that check.
          CC=clang CXX=clang++ EXTRA_CFLAGS="$san -fno-sanitize=function" scripts/build-native.sh "$(go env GOOS)" "$(go env GOARCH)"
          CC=clang CXX=clang++ CGO_CFLAGS="$san" CGO_CXXFLAGS="$san" CGO_LDFLAGS="$san" \
            go test -asan -tags embednative -count=1 ./internal/embed/...

      - name: libFuzzer (5 minutes)
        run: scripts/native-fuzz.sh 300

  # The ADR-018 spike on every PR: each release target builds with the
  # pinned zig, and the Linux ones pass the hardening and glibc-floor checks.
  native-cross:
    name: Native cross-build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    env:
      ZIG_VERSION: "0.17.1"
      ZIG_SHA256: "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build binutils
          curl -sSfL --proto '=https' --tlsv1.2 -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "ZIG=$RUNNER_TEMP/zig/zig" >> "$GITHUB_ENV"

      - name: Build
        run: |
          goos="${{ matrix.target }}"; goarch="${goos#*/}"; goos="${goos%/*}"
          scripts/build-native.sh "$goos" "$goarch"
          flags=(); ld="-s -w"; ext=""
          case "$goos" in
            linux) flags=(-buildmode=pie); ld="$ld -extldflags '-Wl,-z,relro,-z,now'" ;;
            windows) flags=(-buildmode=pie); ext=.exe ;;
          esac
          GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=1 CC="$PWD/scripts/zig-cc.sh" CXX="$PWD/scripts/zig-c++.sh" \
            go build -tags embednative,netgo,osusergo "${flags[@]}" -ldflags "$ld" -o "bin/tb-$goos-$goarch$ext" ./cmd/tb
          ls -l "bin/tb-$goos-$goarch$ext"

      - name: Hardening and glibc floor (Linux)
        if: startsWith(matrix.target, 'linux/')
        run: |
          t="${{ matrix.target }}"
          scripts/native-gate.sh artifact "bin/tb-${t%/*}-${t#*/}" "internal/embed/native/build/${t%/*}_${t#*/}/lib"

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tb-native-${{ strategy.job-index }}
          path: bin/tb-*
          retention-days: 3

  # Each cross-built binary runs tb version and the embed smoke test on its
  # own OS and CPU (the release smoke matrix, on every PR).
  native-run:
    name: Native run (${{ matrix.os }}/${{ matrix.arch }})
    needs: [native-cross]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04, ext: "" }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, ext: "" }
          - { os: darwin, arch: arm64, runner: macos-15, ext: "" }
          - { os: darwin, arch: amd64, runner: macos-15-intel, ext: "" }
          - { os: windows, arch: amd64, runner: windows-2025, ext: .exe }
          - { os: windows, arch: arm64, runner: windows-11-arm, ext: .exe }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tb-native-*
          merge-multiple: true
          path: bin

      - name: tb version names the engine
        run: |
          b="bin/tb-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          chmod +x "$b"
          "$b" version | tee version.txt
          grep -q "embed:  llama.cpp" version.txt

      - name: Embed smoke test
        run: |
          scripts/ci-smoke-model.sh "$RUNNER_TEMP/model.gguf"
          sha="$(sed -n 's/^sha256: //p' .github/embed-smoke-model.txt)"
          model="$RUNNER_TEMP/model.gguf"
          if [[ "${{ matrix.os }}" == windows ]]; then model="$(cygpath -w "$model")"; fi
          "bin/tb-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" __graph-embed --smoke "$model" --sha256 "$sha"
